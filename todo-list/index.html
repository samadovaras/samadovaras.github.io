
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    padding: 30px 15px;
}
.container {
    max-width: 550px;
    margin: auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 16px;
}
h1, .subtitle { text-align: center; }
.subtitle { color: #94a3b8; margin: 12px 0 22px; }
input, select {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: white;
}
button {
    border: none;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
}
.add-btn {
    width: 100%;
    background: #38bdf8;
    color: #0f172a;
    margin-bottom: 20px;
}
.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}
.filters button {
    flex: 1;
    background: #334155;
    color: white;
}
.filters button.active {
    background: #38bdf8;
    color: #0f172a;
}
ul { list-style: none; padding: 0; }
li {
    background: #334155;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 10px;
}
.task-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.task-row input {
    width: auto;
    margin: 0;
}
.task-name {
    flex: 1;
    overflow-wrap: anywhere;
}
.completed .task-name {
    text-decoration: line-through;
    color: #94a3b8;
}
.priority { font-size: 12px; font-weight: bold; }
.high { color: #f87171; }
.medium { color: #facc15; }
.low { color: #4ade80; }
.due-date {
    display: block;
    color: #94a3b8;
    font-size: 12px;
    margin: 9px 0 0 27px;
}
.delete-btn {
    background: #ef4444;
    color: white;
    margin-top: 10px;
}
.empty, .counter {
    text-align: center;
    color: #94a3b8;
}
.counter { margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <input type="text" id="taskInput" placeholder="Enter a new task...">

    <select id="priorityInput">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
    </select>

    <input type="date" id="dueDateInput">

    <button class="add-btn" onclick="addTask()">Add Task</button>

    <div class="filters">
        <button class="active" onclick="filterTasks('all', this)">All</button>
        <button onclick="filterTasks('active', this)">Active</button>
        <button onclick="filterTasks('completed', this)">Completed</button>
    </div>

    <ul id="taskList"></ul>
    <p class="counter" id="counter">0 tasks</p>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let currentFilter = "all";

function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    const priority = document.getElementById("priorityInput").value;
    const dueDate = document.getElementById("dueDateInput").value;

    if (!text) {
        alert("Please enter a task!");
        return;
    }

    tasks.push({
        id: Date.now(),
        text: text,
        completed: false,
        priority: priority,
        dueDate: dueDate
    });

    input.value = "";
    document.getElementById("dueDateInput").value = "";

    saveTasks();
    renderTasks();
}

function toggleTask(id) {
    tasks = tasks.map(task => {
        if (task.id === id) task.completed = !task.completed;
        return task;
    });
    saveTasks();
    renderTasks();
}

function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    renderTasks();
}

function filterTasks(filter, button) {
    currentFilter = filter;

    document.querySelectorAll(".filters button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
    renderTasks();
}

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    const filtered = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
    });

    if (filtered.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "No tasks found.";
        list.appendChild(message);
    }

    filtered.forEach(task => {
        const li = document.createElement("li");

        if (task.completed) li.classList.add("completed");

        const row = document.createElement("div");
        row.className = "task-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.text;

        const priority = document.createElement("span");
        const level = task.priority || "medium";
        priority.className = "priority " + level;
        priority.textContent = level.toUpperCase();

        row.append(checkbox, name, priority);
        li.appendChild(row);

        if (task.dueDate) {
            const date = document.createElement("small");
            date.className = "due-date";
            date.textContent = "Due: " + task.dueDate;
            li.appendChild(date);
        }

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "delete-btn";
        del.addEventListener("click", () => deleteTask(task.id));

        li.appendChild(del);
        list.appendChild(li);
    });

    const completedCount = tasks.filter(t => t.completed).length;
    document.getElementById("counter").textContent =
        `${tasks.length} tasks | ${completedCount} completed`;
}

tasks = tasks.map(task => ({
    ...task,
    priority: task.priority || "medium",
    dueDate: task.dueDate || ""
}));

saveTasks();
renderTasks();
</script>

</body>
</html>
